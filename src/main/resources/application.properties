server.port=8080
spring.application.name=kongbab

# MariaDB 연결 설정
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/kongbab?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 백업 파일 저장 설정
kongbab.backup.directory=D:/\uBC31\uC5C5 \uD30C\uC77C/KONGBAB_BACKUPS_JSON
kongbab.backup.max-count=20

# 관리자 계정 설정
kongbab.admin.username=admin
kongbab.admin.password=kongbab1234

# 세션 유효시간 1시간 설정 (브라우저를 닫았다 열어도 1시간 유지)
server.servlet.session.timeout=1h
server.servlet.session.cookie.max-age=3600
